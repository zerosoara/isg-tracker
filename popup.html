<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<style>
  body { font-family: -apple-system, Segoe UI, Arial, sans-serif; width: 280px; padding: 14px; background:#0f0f13; color:#e8e8f0; margin:0; }
  h1 { font-size: 14px; margin: 0 0 10px; color:#00e5a0; }
  .row { margin-bottom: 10px; padding: 8px 10px; border-radius: 8px; background:#181820; }
  .lbl { font-size: 10px; color:#8e8e9e; text-transform: uppercase; letter-spacing:.06em; margin-bottom:3px; }
  .val { font-size: 13px; font-weight: 600; line-height:1.4; }
  .ok  { color:#00e5a0; }
  .bad { color:#ff6b6b; }
  .time { font-size: 10px; color:#8e8e9e; margin-top: 3px; }
</style>
</head>
<body>
  <h1>🥷 Ninja Tracker Sync</h1>
  <div class="row">
    <div class="lbl">Login status</div>
    <div class="val" id="login-status">Checking…</div>
  </div>
  <div class="row">
    <div class="lbl">Last order sync</div>
    <div class="val" id="sync-status">Checking…</div>
    <div class="time" id="sync-time"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
